[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fsai-aflow"
version = "0.1.0"
description = "AFlow: Automating Agentic Workflow Generation (FSAI fork)"
requires-python = ">=3.11"
dependencies = [
    "aiofiles==24.1.0",
    "deepeval==3.8.6",
    "httpx==0.28.1",
    "mpmath==1.3.0",
    "numpy>=2.4",
    "openai==1.82.0",
    "pandas==2.2.3",
    "pyaml==25.1.0",
    "pydantic>=2.11.7",
    "PyYAML==6.0.2",
    "regex==2024.11.6",
    "requests>=2.32.5",
    "sympy==1.14.0",
    "tenacity==9.1.2",
    "tornado==6.5.5",
    "tqdm==4.67.1",
    "tree-sitter>=0.24",
    "websockets>=16.0",
]

[project.optional-dependencies]
viz = [
    "streamlit==1.54.0",
    "plotly>=5.18.0",
]
bridge = [
    "aiohttp>=3.9",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
aflow-dashboard = "aflow.dashboard:main"

[tool.setuptools.packages.find]
namespaces = true
include = ["aflow", "scripts*", "benchmarks*", "log_viz*", "data*"]
exclude = ["workspace*", "workspace_pilot2*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# JFrog only — pypi.org is blocked by IT. This index is the sole default.
[[tool.uv.index]]
name = "jfrog"
url = "https://fsaiartifact.jfrog.io/artifactory/api/pypi/fsai-private-py-AUS-virtual/simple"
default = true
